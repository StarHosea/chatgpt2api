server {
    listen 80;
    listen [::]:80;
    server_name image.shuangdeng.sapce image-d.shuangdeng.sapce;
    client_max_body_size 100m;
    underscores_in_headers on;

    location ^~ /.well-known/acme-challenge/ {
        root /www/sites/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name image.shuangdeng.sapce image-d.shuangdeng.sapce;
    http2 on;
    client_max_body_size 100m;
    underscores_in_headers on;

    ssl_certificate /usr/local/openresty/nginx/conf/ssl/image.shuangdeng.sapce/fullchain.pem;
    ssl_certificate_key /usr/local/openresty/nginx/conf/ssl/image.shuangdeng.sapce/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
