services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: chatgpt2api:production
    container_name: chatgpt2api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CHATGPT2API_PORT:-3010}:80"
    volumes:
      - ./data:/app/data
      - ./config.json:/app/config.json
    environment:
      STORAGE_BACKEND: ${STORAGE_BACKEND:-json}
      DATABASE_URL: ${DATABASE_URL:-}
      CHATGPT2API_AUTH_KEY: ${CHATGPT2API_AUTH_KEY:?Set CHATGPT2API_AUTH_KEY in .env}
      CHATGPT2API_BASE_URL: ${CHATGPT2API_BASE_URL:-https://image-d.shuangdeng.space}
